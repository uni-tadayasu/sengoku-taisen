<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>戦国VS · 音楽の試聴と確認</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#11150f;color:#efe8d9}body{max-width:780px;margin:40px auto;padding:0 20px;line-height:1.8}h1{font-family:serif;font-size:28px;color:#dec080;margin-bottom:8px}p{color:#bec6b5}label{display:block;margin-top:20px}select,button{font:inherit;min-height:46px;padding:8px 12px;border:1px solid #837047;border-radius:5px;background:#20261c;color:#f2e8d2}select{width:100%}button{margin-top:22px;cursor:pointer;background:#493a20}button:disabled{opacity:.5}audio{display:block;width:100%;margin-top:20px}a{color:#e5c27d}progress{display:block;width:100%;margin:20px 0;height:10px;accent-color:#d7b473}pre{white-space:pre-wrap;font-size:13px;color:#bec6b5}fieldset{border:1px solid #65573c;border-radius:6px;margin-top:24px;padding:20px}small{color:#aeb6a8}
  </style>
</head>
<body>
  <h1>戦国VS · 音楽の試聴と確認</h1>
  <p>本体と同じ楽譜・音源・残響を使い、この端末内で試聴用の音声を作ります。ゲームの保存やオンラインデータには接続しません。</p>
  <label for="track">試聴する曲</label><select id="track"></select>
  <label for="excerpt">長さ</label><select id="excerpt"><option value="climax">大合奏の抜粋（約16〜25秒）</option><option value="full">全曲（約1〜2分）</option></select>
  <button id="render" type="button">試聴用の音声を作る</button>
  <progress id="progress" max="100" value="0" hidden></progress>
  <p id="status" role="status">曲と長さを選んでください。音声の作成が終わると再生できます。</p>
  <audio id="audio" controls preload="metadata" hidden></audio>
  <p><a id="download" hidden>試聴音声をWAVで保存</a></p>
  <fieldset><legend>確認結果</legend><pre id="metrics">まだ作成していません。</pre></fieldset>
  <p><small>このページは制作時の試聴用です。音源は外部録音ではなく、合成した和楽器・弦・金管・合唱風の音色です。音声は音楽帳の音量100相当で作成し、再生プレイヤーの音量は30%から始めます。ゲームの初期音量10は変更しません。</small></p>
  <script src="../music.js"></script>
  <script src="music-audition.js"></script>
</body>
</html>
