name: Check game performance and continuity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/performance.yml'
      - 'package*.json'
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'tools/build-game-entry.cjs'
      - 'tools/compact-css.cjs'
      - 'tools/game-entry.json'
      - 'tests/**'
      - 'server/**'
      - 'assets/castle-scenes/**'
      - 'docs/castle-scenes-20261128.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance.yml'
      - 'package*.json'
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'tools/build-game-entry.cjs'
      - 'tools/compact-css.cjs'
      - 'tools/game-entry.json'
      - 'tests/**'
      - 'server/**'
      - 'assets/castle-scenes/**'
      - 'docs/castle-scenes-20261128.json'

permissions:
  contents: read

concurrency:
  group: game-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install the pinned asset compiler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify compiled entry and offline loading
        run: npm run test:entry
      - name: Check planning, comparison, navigation and deferred UI
        run: npm run test:interface
      - name: Verify rank rice production and its displayed ledger
        run: |
          node tests/test-rank-rice-production.cjs
          node tests/test-player-evaluation-ui.cjs
          node tests/test-economy-ui.cjs
          node tests/test-economy-balance.cjs
      - name: Verify reward receipts, retries and account isolation
        run: node tests/test-rewards.cjs
      - name: Check shipped asset budgets and runtime parity
        run: |
          node tests/test-asset-budget.cjs
          node tests/test-minified-runtime.cjs
      - name: Verify list, map and input continuity
        run: |
          node tests/test-stable-dom.cjs
          node tests/test-world-map.cjs
          node tests/test-ui-continuity.cjs
          node tests/test-quiet-sync-layout.cjs
          node tests/test-social-viewport.cjs
          node tests/test-social-chat.cjs
          node tests/test-social-avatar.cjs
          node tests/test-profile-name-ui.cjs
          node tests/test-responsive-text.cjs
  chat-server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify chat replies, mentions and room authorization
        run: node server/test-chat-replies.mjs
      - name: Verify display-name variants and concurrent profile changes
        run: |
          node server/test-profile-name.mjs
          node server/test-moderated-player-names.mjs
      - name: Verify public city honors and the current Kagoshima deputy
        run: node server/test-city-honors.mjs
      - name: Verify production error diagnostics preserve private data
        run: node server/test-internal-diagnostics.mjs
      - name: Verify public messages against D1 compound SELECT limits
        run: node server/test-message-d1-limits.mjs
      - name: Verify shared BGM authorization, revisions and retries
        run: node server/test-admin-music.mjs
      - name: Verify anonymous promotion counters and operator authorization
        run: node server/test-promotion.mjs
  dispatch-travel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify dispatch return boundaries and save recovery
        run: |
          node tests/test-covert-return-travel.cjs
          node tests/test-travel-engine.cjs
          node tests/test-covert-engine.cjs
      - name: Verify route previews and countdown continuity
        run: |
          node tests/test-covert-ui.cjs
          node tests/test-covert-dom.cjs
          node tests/test-travel-ui.cjs
          node tests/test-alliance-strategy.cjs
      - name: Verify authoritative arrival, defense and troop returns
        run: |
          node server/test-alliance-travel.mjs
          node server/test-alliance-strategy.mjs
          node server/test-covert.mjs
          node server/test-battle-travel.mjs
      - name: Verify half-resource victory rewards and atomic balance transfers
        run: |
          node server/test-field-loot.mjs
          node server/test-field.mjs
          node server/test-field-capture.mjs
          node server/test-court-base-protection.mjs
          node server/test-field-mail.mjs
  save-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify legacy saves, world clocks and officer health
        run: |
          node server/test-legacy-save-recovery.mjs
          node server/test-world-clock.mjs
          node server/test-officer-health.mjs
      - name: Verify operator recovery and explicit progress choices
        run: |
          node tests/test-settings-usability.cjs
          node tests/test-domain-recovery.cjs
          node server/test-admin-recovery.mjs
      - name: Verify expulsion, deputy appointment and protected Kagoshima
        run: |
          node server/test-expulsion.mjs
          node server/test-deputy-operator.mjs
          node server/test-deputy-operations.mjs
          node server/test-deputy-officer.mjs
          node server/test-deputy-projection.mjs
          node tests/test-deputy-engine.cjs
          node tests/test-deputy-sync.cjs
          node tests/test-expulsion-sync.cjs
      - name: Verify authoritative sync, field migration and world cycles
        run: |
          node server/test-sync.mjs
          node server/test-field-migration.mjs
          node server/test-world-cycles.mjs
          node tests/test-sync-integration.mjs
      - name: Verify authoritative rewards and paid reward migration
        run: |
          node server/test-rewards.mjs
          node server/test-paid-rewards-migration.mjs
      - name: Verify castle artwork purchases, public ownership and preserved payments
        run: |
          node server/test-castle-heritage-migration.mjs
          node server/test-castle-heritage.mjs
          node tests/test-castle-heritage-artwork.cjs
          node tests/test-town-castle-scenes.cjs
          node tests/test-castle-scene-assets.cjs
      - name: Verify payment totals, supporter renewal and observed player retention
        run: node server/test-premium-metrics.mjs
      - name: Verify player retainer bonuses and castle membership
        run: |
          node tests/test-residency-engine.cjs
          node tests/test-court-protection-engine.cjs
          node tests/test-court-protection-sync.cjs
          node tests/test-residency-ui.cjs
          node server/test-residency.mjs
      - name: Verify shared construction and private Kyoto migration
        run: |
          node tests/test-kyoto-gosho-engine.cjs
          node tests/test-staff-base-sync.cjs
          node server/test-kyoto-migration.mjs
          node server/test-staff-base.mjs
          node server/test-construction-queues.mjs
      - name: Verify authoritative rank production and save continuity
        run: |
          node server/test-economy-balance.mjs
          node server/test-maintenance.mjs
          node server/test-evaluation.mjs

  court-appointments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify fixed chancellor, exclusive offices and atomic appointments
        run: |
          node server/test-court-offices.mjs
          node server/test-court-office-messaging.mjs
      - name: Verify imperial approvals, succession and delegated regency
        run: |
          node server/test-shogunate.mjs shogunate.js
          node server/test-shogunate-approval.mjs
          node server/test-retired-emperor.mjs
          node server/test-succession-approval.mjs
          node server/test-regency.mjs
          node server/test-regency-public.mjs
          node tests/test-shogunate-ui.cjs
          node tests/test-retired-emperor-ui.cjs
      - name: Verify private court event room and bounded game AI
        run: |
          node server/test-court-event-planner.mjs
          node server/test-court-events.mjs
          node tests/test-court-event-room-ui.cjs
          node tests/test-court-api.cjs
          node server/test-events.mjs
      - name: Verify court privacy, public titles and Kyoto continuity
        run: |
          node server/test-court.mjs
          node server/test-public-court.mjs
          node server/test-court-moderation.mjs
          node server/test-court-attacks.mjs
          node server/test-honorific-messaging.mjs
          node server/test-kyoto-migration.mjs
