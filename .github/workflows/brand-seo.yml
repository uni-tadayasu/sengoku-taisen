name: Check brand and public discovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/brand-seo.yml'
      - 'site-metadata.json'
      - 'brand-discovery.css'
      - 'public-luxury.css'
      - 'assets/crest.svg'
      - 'assets/emblem.webp'
      - '**/*.html'
      - 'manifest.webmanifest'
      - '*sitemap.xml'
      - 'robots.txt'
      - 'CNAME'
      - 'favicon.ico'
      - 'apple-touch-icon.png'
      - 'assets/branding/**'
      - 'assets/responsive/**'
      - 'assets/chronicle/**'
      - 'assets/ogp.jpg'
      - 'assets/*icon*.png'
      - 'sw.js'
      - 'config.js'
      - 'engine.js'
      - '*.bundle.*'
      - 'tools/*public*'
      - 'tools/build-brand-icons.py'
      - 'tools/*page.cjs'
      - 'tools/about-content.cjs'
      - 'tools/page-security.cjs'
      - 'tools/notify-indexnow.mjs'
      - 'tools/indexnow-config.json'
      - 'tests/test-seo.cjs'
      - 'tests/test-public-pages.cjs'
      - 'tests/test-responsive-images.cjs'
      - 'tests/test-service-worker-brand.cjs'
      - 'tests/test-release-assets.cjs'
      - 'tests/test-page-security.cjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/brand-seo.yml'
      - 'site-metadata.json'
      - 'brand-discovery.css'
      - 'public-luxury.css'
      - 'assets/crest.svg'
      - 'assets/emblem.webp'
      - '**/*.html'
      - 'manifest.webmanifest'
      - '*sitemap.xml'
      - 'robots.txt'
      - 'CNAME'
      - 'favicon.ico'
      - 'apple-touch-icon.png'
      - 'assets/branding/**'
      - 'assets/responsive/**'
      - 'assets/chronicle/**'
      - 'assets/ogp.jpg'
      - 'assets/*icon*.png'
      - 'sw.js'
      - 'config.js'
      - 'engine.js'
      - '*.bundle.*'
      - 'tools/*public*'
      - 'tools/build-brand-icons.py'
      - 'tools/*page.cjs'
      - 'tools/about-content.cjs'
      - 'tools/page-security.cjs'
      - 'tools/notify-indexnow.mjs'
      - 'tools/indexnow-config.json'
      - 'tests/test-seo.cjs'
      - 'tests/test-public-pages.cjs'
      - 'tests/test-responsive-images.cjs'
      - 'tests/test-service-worker-brand.cjs'
      - 'tests/test-release-assets.cjs'
      - 'tests/test-page-security.cjs'

permissions:
  contents: read

concurrency:
  group: brand-seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check generated public documents
        run: node tools/build-public-pages.cjs --check
      - name: Check metadata, artwork and notification contracts
        run: node tests/test-seo.cjs
      - name: Check crawlable links and structured data
        run: node tests/test-public-pages.cjs
      - name: Check responsive artwork and image preload
        run: node tests/test-responsive-images.cjs
      - name: Check current-brand cache behavior
        run: node tests/test-service-worker-brand.cjs
      - name: Check offline release and asset fingerprints
        run: node tests/test-release-assets.cjs
      - name: Check public page content policies
        run: node tests/test-page-security.cjs
