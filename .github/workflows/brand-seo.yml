name: Check brand and public discovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/brand-seo.yml'
      - 'site-metadata.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/build-game-entry.cjs'
      - 'brand-discovery.css'
      - 'promotion.css'
      - 'promotion-share.js'
      - 'public-growth.js'
      - 'promotion-admin.js'
      - 'promotion-admin.css'
      - 'social.js'
      - 'english-introduction.css'
      - 'tools/game-entry.json'
      - 'assets/promo/**'
      - 'public-luxury.css'
      - 'assets/crest.svg'
      - 'assets/emblem.webp'
      - '**/*.html'
      - 'manifest.webmanifest'
      - '*sitemap.xml'
      - 'robots.txt'
      - 'CNAME'
      - 'favicon.ico'
      - 'apple-touch-icon.png'
      - 'assets/branding/**'
      - 'assets/responsive/**'
      - 'assets/chronicle/**'
      - 'assets/ogp.jpg'
      - 'assets/*icon*.png'
      - 'sw.js'
      - 'config.js'
      - 'engine.js'
      - '*.bundle.*'
      - 'tools/*public*'
      - 'tools/build-brand-icons.py'
      - 'tools/*page.cjs'
      - 'tools/about-content.cjs'
      - 'tools/press-content.cjs'
      - 'tools/promotion-content.cjs'
      - 'tools/build-promotion-text.cjs'
      - 'tools/news-content.cjs'
      - 'tools/news-releases.json'
      - 'news/feed.xml'
      - 'tools/build-press-kit.py'
      - 'tools/build-promo-video.py'
      - 'tools/page-security.cjs'
      - 'tools/notify-indexnow.mjs'
      - 'tools/indexnow-config.json'
      - 'tests/test-seo.cjs'
      - 'tests/test-public-pages.cjs'
      - 'tests/test-news-feed.py'
      - 'tests/test-promotion-sharing.cjs'
      - 'tests/test-public-growth.cjs'
      - 'tests/test-promotion-admin.cjs'
      - 'tests/test-promotion-invites.cjs'
      - 'tests/test-responsive-images.cjs'
      - 'tests/test-service-worker-brand.cjs'
      - 'tests/test-release-assets.cjs'
      - 'tests/test-page-security.cjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/brand-seo.yml'
      - 'site-metadata.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/build-game-entry.cjs'
      - 'brand-discovery.css'
      - 'promotion.css'
      - 'promotion-share.js'
      - 'public-growth.js'
      - 'promotion-admin.js'
      - 'promotion-admin.css'
      - 'social.js'
      - 'english-introduction.css'
      - 'tools/game-entry.json'
      - 'assets/promo/**'
      - 'public-luxury.css'
      - 'assets/crest.svg'
      - 'assets/emblem.webp'
      - '**/*.html'
      - 'manifest.webmanifest'
      - '*sitemap.xml'
      - 'robots.txt'
      - 'CNAME'
      - 'favicon.ico'
      - 'apple-touch-icon.png'
      - 'assets/branding/**'
      - 'assets/responsive/**'
      - 'assets/chronicle/**'
      - 'assets/ogp.jpg'
      - 'assets/*icon*.png'
      - 'sw.js'
      - 'config.js'
      - 'engine.js'
      - '*.bundle.*'
      - 'tools/*public*'
      - 'tools/build-brand-icons.py'
      - 'tools/*page.cjs'
      - 'tools/about-content.cjs'
      - 'tools/press-content.cjs'
      - 'tools/promotion-content.cjs'
      - 'tools/build-promotion-text.cjs'
      - 'tools/news-content.cjs'
      - 'tools/news-releases.json'
      - 'news/feed.xml'
      - 'tools/build-press-kit.py'
      - 'tools/build-promo-video.py'
      - 'tools/page-security.cjs'
      - 'tools/notify-indexnow.mjs'
      - 'tools/indexnow-config.json'
      - 'tests/test-seo.cjs'
      - 'tests/test-public-pages.cjs'
      - 'tests/test-news-feed.py'
      - 'tests/test-promotion-sharing.cjs'
      - 'tests/test-public-growth.cjs'
      - 'tests/test-promotion-admin.cjs'
      - 'tests/test-promotion-invites.cjs'
      - 'tests/test-responsive-images.cjs'
      - 'tests/test-service-worker-brand.cjs'
      - 'tests/test-release-assets.cjs'
      - 'tests/test-page-security.cjs'

permissions:
  contents: read

concurrency:
  group: brand-seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned build tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check generated public documents
        run: node tools/build-public-pages.cjs --check
      - name: Check the downloadable press kit
        run: python3 tools/build-press-kit.py --check
      - name: Check metadata, artwork and notification contracts
        run: node tests/test-seo.cjs
      - name: Check crawlable links and structured data
        run: node tests/test-public-pages.cjs
      - name: Check release feed and permanent update links
        run: python3 tests/test-news-feed.py
      - name: Check sharing and clipboard recovery
        run: node tests/test-promotion-sharing.cjs
      - name: Check anonymous introduction counters
        run: node tests/test-public-growth.cjs
      - name: Check owner-only promotion reporting
        run: node tests/test-promotion-admin.cjs
      - name: Check invitation links and copy feedback
        run: node tests/test-promotion-invites.cjs
      - name: Check responsive artwork and image preload
        run: node tests/test-responsive-images.cjs
      - name: Check current-brand cache behavior
        run: node tests/test-service-worker-brand.cjs
      - name: Check offline release and asset fingerprints
        run: node tests/test-release-assets.cjs
      - name: Check public page content policies
        run: node tests/test-page-security.cjs
