<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">新発田家：四つ目結（参考意匠）</title><desc id="description">伝世軍旗の紹介を参考に四つ目結を採用。重家に三つ星を挙げる資料もあり図様の同定は未確定。溝口家の五階菱とは区別。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><g transform="rotate(45 128 128)"><g transform="translate(26.88 26.88) scale(0.79)"><g transform="rotate(0 89 89)"><rect x="54.5" y="54.5" width="69" height="69" fill="none" stroke="#e8d5a7" stroke-width="18"/></g><g transform="rotate(0 167 89)"><rect x="132.5" y="54.5" width="69" height="69" fill="none" stroke="#e8d5a7" stroke-width="18"/></g><g transform="rotate(0 89 167)"><rect x="54.5" y="132.5" width="69" height="69" fill="none" stroke="#e8d5a7" stroke-width="18"/></g><g transform="rotate(0 167 167)"><rect x="132.5" y="132.5" width="69" height="69" fill="none" stroke="#e8d5a7" stroke-width="18"/></g></g></g></g></svg>
