<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">千葉家：月星</title><desc id="description">千葉氏の月星紋。大きい円を月、小さい円を星として表す形を採用。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><circle cx="128" cy="150" r="62"/><circle cx="128" cy="47" r="19"/></g></svg>
