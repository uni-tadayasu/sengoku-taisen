<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">尼子家：平四つ目結</title><desc id="description">尼子氏に結び付けられる四つ目結を採用。同族・分家による傾きや配置の違いはある。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><g transform="rotate(0 89 89)"><rect x="54.5" y="54.5" width="69" height="69" fill="none" stroke="#e8d5a7" stroke-width="18"/></g><g transform="rotate(0 167 89)"><rect x="132.5" y="54.5" width="69" height="69" fill="none" stroke="#e8d5a7" stroke-width="18"/></g><g transform="rotate(0 89 167)"><rect x="54.5" y="132.5" width="69" height="69" fill="none" stroke="#e8d5a7" stroke-width="18"/></g><g transform="rotate(0 167 167)"><rect x="132.5" y="132.5" width="69" height="69" fill="none" stroke="#e8d5a7" stroke-width="18"/></g></g></svg>
