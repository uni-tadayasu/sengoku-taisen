<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">武田家：四割菱（武田菱）</title><desc id="description">武田氏の代表紋。四つの菱形の間隔を小型表示用に確保。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><polygon points="128,69 175,96 128,123 81,96"/><polygon points="77,101 124,128 77,155 30,128"/><polygon points="179,101 226,128 179,155 132,128"/><polygon points="128,133 175,160 128,187 81,160"/></g></svg>
