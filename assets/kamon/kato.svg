<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">加藤家：蛇の目</title><desc id="description">加藤清正・嘉明の両系統が混在するゲーム設定のため、加藤氏の代表紋の一つを採用。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><circle cx="128" cy="128" r="85" fill="none" stroke="#e8d5a7" stroke-width="47"/></g></svg>
