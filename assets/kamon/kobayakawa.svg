<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">小早川家：左三つ巴</title><desc id="description">小早川氏の代表紋。小早川秀秋の違い鎌など、人物ごとの別紋は共通章に反映していない。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><g transform="rotate(0 128 128)"><path d="M128 37C171 38 207 73 207 117C186 93 163 85 142 96C126 105 109 97 104 80C99 57 109 38 128 37Z"/></g><g transform="rotate(120 128 128)"><path d="M128 37C171 38 207 73 207 117C186 93 163 85 142 96C126 105 109 97 104 80C99 57 109 38 128 37Z"/></g><g transform="rotate(240 128 128)"><path d="M128 37C171 38 207 73 207 117C186 93 163 85 142 96C126 105 109 97 104 80C99 57 109 38 128 37Z"/></g></g></svg>
