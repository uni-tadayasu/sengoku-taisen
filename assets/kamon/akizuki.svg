<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">秋月家：剣菱（替紋）</title><desc id="description">県立図書館が挙げる秋月氏の替紋・旗紋を採用。本紋の三つ撫子と混同しない。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><polygon points="128,73 193,128 128,183 63,128"/><g transform="rotate(0 128 128)"><polygon points="128,22 112,68 144,68"/></g><g transform="rotate(90 128 128)"><polygon points="128,22 112,68 144,68"/></g><g transform="rotate(180 128 128)"><polygon points="128,22 112,68 144,68"/></g><g transform="rotate(270 128 128)"><polygon points="128,22 112,68 144,68"/></g></g></svg>
