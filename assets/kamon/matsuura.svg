<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">松浦家：三つ星</title><desc id="description">平戸松浦氏の星紋。梶葉紋も伝わる。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><circle cx="128" cy="73" r="30"/><circle cx="80" cy="159" r="30"/><circle cx="176" cy="159" r="30"/></g></svg>
