<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">脇坂家：輪違い</title><desc id="description">脇坂氏の甲冑などに見える二輪の組み合わせを参照。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><circle cx="88" cy="128" r="62" fill="none" stroke="#e8d5a7" stroke-width="18"/><circle cx="168" cy="128" r="62" fill="none" stroke="#e8d5a7" stroke-width="18"/></g></svg>
