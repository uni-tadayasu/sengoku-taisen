<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">吉見家：丸に二つ引両</title><desc id="description">津和野・石見系の吉見氏として整理。同姓の別系統の紋を一律に割り当てない。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><circle cx="128" cy="128" r="108" fill="none" stroke="#e8d5a7" stroke-width="10"/><rect x="35" y="92.5" width="186" height="25"/><rect x="35" y="138.5" width="186" height="25"/></g></svg>
