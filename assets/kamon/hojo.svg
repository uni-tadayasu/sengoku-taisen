<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">北条家：三つ鱗</title><desc id="description">後北条氏の代表紋。三つの鱗の間を小型表示用にわずかに離している。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><polygon points="128,28 88,99 168,99"/><polygon points="84,106 39,185 129,185"/><polygon points="172,106 127,185 217,185"/></g></svg>
