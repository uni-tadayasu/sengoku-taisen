<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">本多家：丸に立ち葵</title><desc id="description">本多氏の立ち葵紋を参照した略図。徳川氏の三つ葉葵とは茎葉の構成を区別。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><circle cx="128" cy="128" r="108" fill="none" stroke="#e8d5a7" stroke-width="10"/><path d="M128 66L128 205" fill="none" stroke="#e8d5a7" stroke-width="9"/><g transform="translate(40.96 -1.04) scale(0.68)"><path d="M128 118 C107 113 71 89 82 59 C90 39 113 36 128 58 C143 36 166 39 174 59 C185 89 149 113 128 118Z"/></g><g transform="rotate(-42 83 153)"><g transform="translate(-0.2 69.8) scale(0.65)"><path d="M128 118 C107 113 71 89 82 59 C90 39 113 36 128 58 C143 36 166 39 174 59 C185 89 149 113 128 118Z"/></g></g><g transform="rotate(42 173 153)"><g transform="translate(89.8 69.8) scale(0.65)"><path d="M128 118 C107 113 71 89 82 59 C90 39 113 36 128 58 C143 36 166 39 174 59 C185 89 149 113 128 118Z"/></g></g></g></svg>
