<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">遠藤家：十曜</title><desc id="description">郡上遠藤氏の伝承紋の一つを採用。亀甲・月星など複数の使用紋が伝わる。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><circle cx="128" cy="128" r="32"/><circle cx="128" cy="46" r="18"/><circle cx="180.71" cy="65.18" r="18"/><circle cx="208.75" cy="113.76" r="18"/><circle cx="199.01" cy="169" r="18"/><circle cx="156.05" cy="205.05" r="18"/><circle cx="99.95" cy="205.05" r="18"/><circle cx="56.99" cy="169" r="18"/><circle cx="47.25" cy="113.76" r="18"/><circle cx="75.29" cy="65.18" r="18"/></g></svg>
