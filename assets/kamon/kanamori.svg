<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">金森家：梅鉢（表梅鉢）</title><desc id="description">金森長近・可重の時期を想定して表梅鉢を採用。後代の裏梅鉢とは区別。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><circle cx="128" cy="67" r="26"/><circle cx="186.01" cy="109.15" r="26"/><circle cx="163.85" cy="177.35" r="26"/><circle cx="92.15" cy="177.35" r="26"/><circle cx="69.99" cy="109.15" r="26"/><circle cx="128" cy="128" r="14"/></g></svg>
