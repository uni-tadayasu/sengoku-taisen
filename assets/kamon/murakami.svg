<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">村上家：丸に上の字</title><desc id="description">瀬戸内の村上武吉系統に合わせた文字紋。家名の頭文字を代用した創作章ではない。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><circle cx="128" cy="128" r="108" fill="none" stroke="#e8d5a7" stroke-width="10"/><path d="M118 50H138V101H185V120H138V181H213V202H43V181H118Z"/></g></svg>
