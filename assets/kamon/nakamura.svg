<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">中村家：星梅鉢</title><desc id="description">中村一氏系統の伝承紋を採用。米子城の中村一忠を同系統として整理。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><circle cx="128" cy="67" r="26"/><circle cx="186.01" cy="109.15" r="26"/><circle cx="163.85" cy="177.35" r="26"/><circle cx="92.15" cy="177.35" r="26"/><circle cx="69.99" cy="109.15" r="26"/><circle cx="128" cy="128" r="14"/></g></svg>
