<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">小出家：丸に額</title><desc id="description">岸和田市の小出家甲冑資料に見える額紋を参照。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><circle cx="128" cy="128" r="108" fill="none" stroke="#e8d5a7" stroke-width="10"/><rect x="76" y="64" width="104" height="128" fill="none" stroke="#e8d5a7" stroke-width="14"/><rect x="102" y="88" width="52" height="80" fill="none" stroke="#e8d5a7" stroke-width="5"/></g></svg>
