<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">河野家：折敷に三文字</title><desc id="description">伊予河野氏の意匠。折敷の内側に三文字を置く形を幾何学的に整理。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><polygon points="226.86,168.95 168.95,226.86 87.05,226.86 29.14,168.95 29.14,87.05 87.05,29.14 168.95,29.14 226.86,87.05" fill="none" stroke="#e8d5a7" stroke-width="10" stroke-linejoin="miter"/><rect x="64" y="70" width="128" height="20"/><rect x="78" y="119" width="100" height="20"/><rect x="55" y="169" width="146" height="20"/></g></svg>
