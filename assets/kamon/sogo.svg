<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">十河家：檜扇</title><desc id="description">十河氏に伝わる扇紋を採用。扇台を添えたゲーム用の略図で、現存軍旗の復刻ではない。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><g transform="translate(30.72 5.72) scale(0.76)"><path d="M128 208L27 76Q128 7 229 76Z" fill="none" stroke="#e8d5a7" stroke-width="10" stroke-linejoin="round"/><path d="M128 208L32.31 101.73" fill="none" stroke="#e8d5a7" stroke-width="5"/><path d="M128 208L60.87 81.74" fill="none" stroke="#e8d5a7" stroke-width="5"/><path d="M128 208L93.41 69.25" fill="none" stroke="#e8d5a7" stroke-width="5"/><path d="M128 208L128 65" fill="none" stroke="#e8d5a7" stroke-width="5"/><path d="M128 208L162.59 69.25" fill="none" stroke="#e8d5a7" stroke-width="5"/><path d="M128 208L195.13 81.74" fill="none" stroke="#e8d5a7" stroke-width="5"/><path d="M128 208L223.69 101.73" fill="none" stroke="#e8d5a7" stroke-width="5"/><circle cx="128" cy="202" r="8"/></g><rect x="59" y="173" width="138" height="12"/><rect x="95" y="185" width="66" height="19"/><rect x="75" y="205" width="106" height="12"/></g></svg>
