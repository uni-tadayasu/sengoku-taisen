<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">津軽家：卍（旗印）</title><desc id="description">弘前市が津軽氏の旗印として紹介する卍を採用。津軽家の甲冑には牡丹の丸紋も確認できる。寺社・家紋に使われる日本の伝統的な紋様として表示。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><g transform="translate(0 0) scale(1)"><path d="M128 45V211M45 128H211M128 45H45M211 128V45M128 211H211M45 128V211" fill="none" stroke="#e8d5a7" stroke-width="20" stroke-linejoin="miter"/></g></g></svg>
