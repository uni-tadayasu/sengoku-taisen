<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">立花家：祇園守</title><desc id="description">立花氏の代表的な祇園守を、小型表示用に幾何学的に整理。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><circle cx="128" cy="128" r="108" fill="none" stroke="#e8d5a7" stroke-width="10"/><g transform="rotate(45 128 128)"><rect x="82" y="82" width="92" height="92" fill="none" stroke="#e8d5a7" stroke-width="11"/></g><rect x="63" y="58" width="130" height="16"/><rect x="63" y="182" width="130" height="16"/><rect x="78" y="51" width="13" height="154"/><rect x="165" y="51" width="13" height="154"/><circle cx="128" cy="128" r="23" fill="none" stroke="#e8d5a7" stroke-width="8"/></g></svg>
