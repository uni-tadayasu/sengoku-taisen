<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description"><title id="title">大内家：大内菱</title><desc id="description">大内氏の唐花菱系の装飾を参照。中世の大内菱には複数の形があり、本図は花弁と菱形外郭を組み合わせた略図。 独自に描いた略図。精密な文化財の復刻ではありません。</desc><g fill="#e8d5a7"><polygon points="128,48 234,128 128,208 22,128" fill="none" stroke="#e8d5a7" stroke-width="8"/><polygon points="128,29 140,38 128,47 116,38"/><polygon points="244,119 256,128 244,137 232,128"/><polygon points="128,209 140,218 128,227 116,218"/><polygon points="12,119 24,128 12,137 0,128"/><polygon points="99,61 111,70 99,79 87,70"/><polygon points="72,81 84,90 72,99 60,90"/><polygon points="157,61 169,70 157,79 145,70"/><polygon points="184,81 196,90 184,99 172,90"/><polygon points="99,177 111,186 99,195 87,186"/><polygon points="72,157 84,166 72,175 60,166"/><polygon points="157,177 169,186 157,195 145,186"/><polygon points="184,157 196,166 184,175 172,166"/><g transform="rotate(0 128 128)"><path d="M128 116C115 106 109 84 115 81L120 83C118 70 124 60 128 57C132 60 138 70 136 83L141 81C147 84 141 106 128 116Z"/></g><g transform="rotate(90 128 128)"><path d="M128 116C115 106 109 84 115 81L120 83C118 70 124 60 128 57C132 60 138 70 136 83L141 81C147 84 141 106 128 116Z"/></g><g transform="rotate(180 128 128)"><path d="M128 116C115 106 109 84 115 81L120 83C118 70 124 60 128 57C132 60 138 70 136 83L141 81C147 84 141 106 128 116Z"/></g><g transform="rotate(270 128 128)"><path d="M128 116C115 106 109 84 115 81L120 83C118 70 124 60 128 57C132 60 138 70 136 83L141 81C147 84 141 106 128 116Z"/></g><circle cx="128" cy="128" r="12"/><polygon points="45,112 73,91 111,116"/><polygon points="183,91 211,112 145,116"/><polygon points="45,144 73,165 111,140"/><polygon points="183,165 211,144 145,140"/></g></svg>
