      <stop offset=".28" stop-color="#edc36a"/>
      <stop offset=".48" stop-color="#fff2b6"/>
      <stop offset=".72" stop-color="#bd812f"/>
      <stop offset="1" stop-color="#f2ce7a"/>
    </linearGradient>
    <linearGradient id="clc-relief" x1="0" y1="0" x2=".2" y2="1">
      <stop stop-color="#fff9df"/>
      <stop offset=".5" stop-color="#ffe19b"/>
      <stop offset="1" stop-color="#b47b30"/>
    </linearGradient>
    <radialGradient id="clc-enamel" cx=".3" cy=".2" r=".9">
      <stop stop-color="#b74440"/>
      <stop offset=".5" stop-color="#6c202b"/>
      <stop offset="1" stop-color="#220f20"/>
    </radialGradient>
    <linearGradient id="clc-gem" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe9dd"/>
      <stop offset=".35" stop-color="#ef8b69"/>
      <stop offset=".7" stop-color="#b42e37"/>
      <stop offset="1" stop-color="#591b2b"/>
