<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="clc-title clc-description">
  <title id="clc-title">城主の紋章</title>
  <desc id="clc-description">金の天守を深紅の七宝と二重の金輪に据え、金の葉飾りと宝石で囲んだ、一般拠点のプレイヤーを表す戦国VS独自の紋章。</desc>
